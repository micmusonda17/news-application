{% extends 'news/base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="card">
    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Save</button>
        <a class="button grey" href="{% url 'newsletter_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
